name: CozyBrew
options:
  bundleIdPrefix: com.s2j
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  xcodeVersion: "26.3"
  projectFormat: xcode16_3
  lastUpgradeCheck: 2630
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    # アプリ / テスト用 (埋め込み framework は settingGroups.embeddedFramework)
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PJWXCWS5U5
  configs:
    Debug:
      CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    Release:
      CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

settingGroups:
  embeddedFramework:
    # Xcode 推奨: 埋め込み framework はビルド時署名しない (Embed の CodeSignOnCopy でアプリに合わせる)
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: "-"
    DEFINES_MODULE: true
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_MODULE_VERIFIER: YES
    # Xcode「Enable Module Verifier Supported Languages」推奨 (Issues ダイアログ)
    MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.2

packages:
  s2j-source-list:
    url: https://github.com/stein2nd/s2j-source-list.git
    branch: main
  s2j-about-window:
    url: https://github.com/stein2nd/s2j-about-window.git
    branch: main

targets:
  CozyBrewApp:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    knownLocalizations:
      - en
      - ja
    sources:
      - path: CozyBrewApp
        excludes:
          - Resources/AppIcon-source.jpg
    resources:
      - path: CozyBrewApp/Assets.xcassets
      - path: CozyBrewApp/Resources/LICENSE.txt
      - path: CozyBrewApp/Resources/ACKNOWLEDGEMENTS.md
    info:
      path: CozyBrewApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2024 S2J. All rights reserved."
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: >-
          CozyBrew opens Terminal to run Homebrew commands when a Cask upgrade
          needs an interactive administrator session.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: CozyBrewApp/CozyBrewApp.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.s2j.CozyBrew
      PRODUCT_NAME: $(TARGET_NAME)
      SWIFT_VERSION: "6.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      CODE_SIGN_ENTITLEMENTS: CozyBrewApp/CozyBrewApp.entitlements
      ENABLE_HARDENED_RUNTIME: true
      ENABLE_APP_SANDBOX: false
      MARKETING_VERSION: "1.0.24"
      CURRENT_PROJECT_VERSION: "4"
      VERSIONING_SYSTEM: "apple-generic"
    dependencies:
      - target: CozyBrewCore
      - target: CozyBrewService
      - target: CozyBrewUIComponents

  CozyBrewCore:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/CozyBrewCore
    settings:
      groups: [embeddedFramework]
      PRODUCT_BUNDLE_IDENTIFIER: com.s2j.CozyBrewCore
      PRODUCT_NAME: CozyBrewCore

  CozyBrewService:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/CozyBrewService
    dependencies:
      - target: CozyBrewCore
    settings:
      groups: [embeddedFramework]
      PRODUCT_BUNDLE_IDENTIFIER: com.s2j.CozyBrewService
      PRODUCT_NAME: CozyBrewService

  CozyBrewUIComponents:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/CozyBrewUIComponents
    resources:
      - path: Sources/CozyBrewUIComponents/Resources
    dependencies:
      - target: CozyBrewService
      - package: s2j-source-list
        product: S2JSourceList
      - package: s2j-about-window
        product: S2JAboutWindow
    settings:
      groups: [embeddedFramework]
      PRODUCT_BUNDLE_IDENTIFIER: com.s2j.CozyBrewUIComponents
      PRODUCT_NAME: CozyBrewUIComponents

  CozyBrewUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/CozyBrewUITests
    dependencies:
      - target: CozyBrewApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.s2j.CozyBrewUITests
      PRODUCT_NAME: CozyBrewUITests
      SWIFT_VERSION: "6.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      TEST_TARGET_NAME: CozyBrewApp
      GENERATE_INFOPLIST_FILE: YES

schemes:
  CozyBrewApp:
    build:
      targets:
        CozyBrewApp: all
        CozyBrewCore: all
        CozyBrewService: all
        CozyBrewUIComponents: all
    run:
      config: Debug
    test:
      targets:
        - CozyBrewUITests
