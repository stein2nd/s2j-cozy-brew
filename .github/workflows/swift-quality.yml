name: Swift Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  version-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: version:check
        run: npm run version:check

  lint-swift:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install Swift quality tools
        env:
          PERIPHERY_VERSION: "3.8.0"
        run: |
          brew update
          brew install xcodegen swiftlint swiftformat
          curl -fsSL \
            "https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip" \
            -o /tmp/periphery.zip
          unzip -o -q /tmp/periphery.zip -d /tmp/periphery-unpack
          PERIPHERY_BIN="$(find /tmp/periphery-unpack -type f -name periphery -perm +111 | head -1)"
          install -m 755 "$PERIPHERY_BIN" /usr/local/bin/periphery
          periphery version

      - name: lint:swift
        run: npm run lint:swift